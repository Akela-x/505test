<!DOCTYPE html>

<body>
    <script>
        window.applicationCache.onprogress = function (a) { document.getElementById("msgs2").innerHTML = "Installing Offline Cache: " + (Math.round(100 * (a.loaded / a.total))) + "%"; };

        window.applicationCache.onerror = function () { localStorage.cached505 = "yes"; };

    <div style="padding:14px 26px;">
        <div class="status">

    <script>
        function success() {
            document.getElementById("menu").style.display = "block";
            document.getElementById("progress").style.display = "none";
            setTimeout(load_goldhen18, 300);
        }

        function allset() {
            msgs.innerHTML = LoadedMSG;
        }

        var payloadBusy = false;
        function load_payload() {
            if (payloadBusy) return;
            payloadBusy = true;
            req1 = null;
            var req1 = new XMLHttpRequest();
            req1.open('GET', PLfile); req1.responseType = "arraybuffer"; req1.timeout = 15000;
            req1.ontimeout = function () { payloadBusy = false; msgs.innerHTML = "Payload request timed out."; };
            req1.onerror = function () { payloadBusy = false; msgs.innerHTML = "Payload request failed."; };
            req1.send();
            req1.onreadystatechange = function () {
                if (req1.readyState == 4) {
                    if (req1.status != 200 || !req1.response || !req1.response.byteLength) {
                        payloadBusy = false;
                        msgs.innerHTML = "Payload file is unavailable.";
                        return;
                    }
                    var padding1 = new Uint8Array(4 - (req1.response.byteLength % 4) % 4);
                    var tmp1 = new Uint8Array(req1.response.byteLength + padding1.byteLength);
                    tmp1.set(new Uint8Array(req1.response), 0);
                    tmp1.set(padding1, req1.response.byteLength);
                    var shellcode1 = new Uint32Array(tmp1.buffer);
                    var code_addr1 = new int64(0x26100000, 0x00000009);
                    p.syscall(477, code_addr1, 0x300000, 7, 0x41000, -1, 0);
                    for (var i = 0; i < shellcode1.length; i++) {
                        p.write4(code_addr1.add32(0x100000 + i * 4), shellcode1[i]);
                    }
                    runPAYLOAD1 = function () {
                        p.fcall(code_addr1);
                        PLfile = null;
                        for (var x = 0; x < 0x300000; x += 8) {
                            p.write8(code_addr1.add32(x), 0);
                        } setTimeout(allset, 50);
                    };
                    setTimeout(runPAYLOAD1, 100);
                }
            };
        }

        function load_goldhen18() {
            msgs.innerHTML = "Loading GoldHEN v2.4b18.12... Please Wait";
            LoadedMSG = "GoldHEN v2.4b18.12 Loaded ✔";
            PLfile = "../goldhen_v2.4b18.12.bin";
            load_payload();
        }

    <script>
        // Трансляция статуса в родительский хост через postMessage
        (function() {
            function relay(el) {
                if (!el || window.parent === window) return;
                var observer = new MutationObserver(function() {
                    try {
                        window.parent.postMessage(
                            { type: 'status505', msg: el.innerHTML, cls: el.className },
                            '*'
                        );
                    } catch(e) {}
                });
                observer.observe(el, { childList: true, subtree: true, characterData: true });
            }

            window.addEventListener('load', function() {
                relay(document.getElementById('msgs2'));
                relay(document.getElementById('msgs'));
                setTimeout(exploit, 50);
            });
        })();
    </script>
